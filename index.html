<!DOCTYPE html>
<!--
  Cubeword smart store redirect.
  Host this single file anywhere static (GitHub Pages is free: put it in a repo,
  Settings → Pages → deploy from branch, done). The game's share text links here
  (main.gd SHARE_LINK); visitors get bounced to the right store for their device,
  and desktop / unknown platforms see both store buttons as a fallback.

  ⚠ Before going live:
  - APP_STORE_URL below is a PLACEHOLDER — replace idXXXXXXXXXX with the real
    numeric Apple app ID once the App Store listing exists. Until then iOS
    visitors fall through to the fallback page (do NOT ship a dead redirect).
  - The Play package id is case-sensitive: com.Loafworks.Cubeword.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cubeword</title>
<meta property="og:title" content="Cubeword">
<meta property="og:description" content="A 3D word game — spell words on a cube of letters.">
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #24262e; color: #eee;
         display: flex; flex-direction: column; align-items: center; justify-content: center;
         min-height: 100vh; text-align: center; gap: 24px; padding: 24px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 2.4rem; }
  p { margin: 0; opacity: 0.8; }
  a.store { display: inline-block; padding: 14px 28px; border-radius: 12px; background: #3a3f4d;
            color: #fff; text-decoration: none; font-size: 1.1rem; }
  a.store:hover { background: #4a5062; }
</style>
</head>
<body>
<h1>Cubeword</h1>
<p>A 3D word game — spell words on a cube of letters.</p>
<a class="store" id="play" href="https://play.google.com/store/apps/details?id=com.Loafworks.Cubeword">Get it on Google Play</a>
<a class="store" id="ios" href="https://apps.apple.com/app/idXXXXXXXXXX" style="display:none">Download on the App Store</a>
<script>
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.Loafworks.Cubeword";
  var APP_STORE_URL = "";   // set to "https://apps.apple.com/app/id<REAL_ID>" when the iOS listing is live
  var ua = navigator.userAgent || "";
  // iPadOS 13+ masquerades as macOS; the touch check catches it.
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  if (APP_STORE_URL) {
    var iosLink = document.getElementById("ios");
    iosLink.href = APP_STORE_URL;
    iosLink.style.display = "inline-block";
  }
  if (isAndroid) location.replace(PLAY_STORE_URL);
  else if (isIOS && APP_STORE_URL) location.replace(APP_STORE_URL);
  // Anything else (desktop, unknown, iOS before the listing exists): stay on
  // this page and show the store button(s).
</script>
</body>
</html>
